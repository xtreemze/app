name: Deploy Vial app to GitHub Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [definition_update]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh keyboard definitions
        run: bun run refresh-kbs

      - name: Resolve GitHub Pages base path
        id: pages-base
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Vial app for GitHub Pages
        env:
          VITE_BASE_PATH: ${{ steps.pages-base.outputs.base }}
        run: bun run build

      - name: Add SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Vial app directly to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
